# Build the offline source's season seed by driving the built app, and publish it as a rolling
# release asset.
#
# NOT part of `npm run build`. Cloudflare Pages' build budget cannot hold thousands of rate-limited
# upstream requests, and a seed that only refreshes on a deploy is stale by construction. This runs on
# a schedule, exports the store out of a real headless browser through the same relay a user goes
# through, gates the result, and replaces the asset. So the data refreshes with no deploy, and a bad
# seed rolls back by re-pointing the tag.
#
# ONCE A SEASON, on the 15th of its first month. 04:17 rather than the top of the hour: scheduled runs
# are queued and the top of the hour is the worst slot.
#
# Two GitHub behaviours this depends on. A `schedule` trigger only ever runs the file on the DEFAULT
# BRANCH, so this fires nothing until it is on main. And in a public repo a scheduled workflow is
# disabled automatically after 60 days with no repository activity.
name: Season seed

on:
  schedule:
    - cron: '17 4 15 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write

# A cancelled run mid-upload can leave the release half-clobbered, so a queued run waits rather than
# replacing the one that is already writing.
concurrency:
  group: season-seed
  cancel-in-progress: false

env:
  TAG: season-seed
  SEED_ORIGIN: http://localhost:4599

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the repo's own version, as test.yml and Pages use: the unit suite below needs its navigator.locks
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # CONTROL, cheap and first. The exporter imports three .ts modules directly and node strips the
      # types, which needs node 22.18 or newer AND the explicit .ts specifiers those modules use. This
      # fails in seconds when either half is missing, rather than after 40 minutes of walking.
      - name: node can load the gate
        run: node -e "import('./src/sources/offline/seed-gate.ts').then(m => { if (typeof m.gateSeed !== 'function') process.exit(1) })"

      # src/generated is gitignored, so a checkout carries none of it and the offline modules cannot
      # even import without this.
      - run: npm run gql-generate

      # scripts/build-anime-data.mjs REFUSES rather than emitting a thinner artifact when it cannot
      # reach the manami release and has no cache. That is right for a deploy and wrong for a
      # scheduled job, where a GitHub incident would red the run over nobody's code. Restored AFTER
      # npm ci, which empties node_modules. Same reasoning as test.yml.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/stub-anime-data.json
          key: stub-anime-data-${{ github.run_id }}
          restore-keys: stub-anime-data-

      - run: npm run data:build

      # CONTROL. The unit suite is what proves the gate can say NO: its tests mutate a valid fixture
      # and require exactly one failure per mutation. A gate that has not been shown to fail is not a
      # gate, and publishing behind one would be worse than publishing behind nothing.
      - run: npm run test:unit

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # ubuntu runners restrict the unprivileged user namespaces chromium's own sandbox needs. Lift
      # the restriction rather than dropping the sandbox. Tolerated failure covers a kernel image
      # without the knob.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # DETACHED, never in the foreground under a timeout: a timeout kills the tier and the walk then
      # runs against a corpse while every step still reports a status.
      - name: serve the build
        run: |
          set -eo pipefail
          nohup npx vp preview --port 4599 --outDir build > preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "$SEED_ORIGIN/" > /dev/null; then echo "served after ${attempt}s"; exit 0; fi
            sleep 1
          done
          echo "the preview server never answered 200 in 60s"
          cat preview.log
          exit 1

      # `tee` so the gate's failure lines survive into the artifact, and `pipefail` so the exporter's
      # exit code is the step's rather than tee's.
      - name: walk and export
        run: |
          set -eo pipefail
          mkdir -p dist-seed
          node scripts/export-season-seed.mjs --origin "$SEED_ORIGIN" --tabs 4 --top 100 --max-minutes 30 2>&1 | tee dist-seed/export.log

      # Printed on EVERY run and independent of the gate. Zero cr, nf and jw ids across hundreds of
      # runs is not an error anywhere in the walk: every run simply comes back small, with no
      # streaming member, which is the same class as a 200 carrying an empty array. The relay from an
      # Azure-hosted runner is unmeasured, and this is where a run measures it.
      - name: relay census
        if: always()
        run: |
          node -e "
            const fs = require('node:fs')
            if (!fs.existsSync('dist-seed/season-seed.manifest.json')) {
              console.log('no manifest was written, so the walk stopped before it could be measured')
              process.exit(0)
            }
            const m = JSON.parse(fs.readFileSync('dist-seed/season-seed.manifest.json','utf8'))
            const s = m.streamingCounts || {}
            const total = (s.cr||0) + (s.nf||0) + (s.jw||0)
            console.log('origins  ' + JSON.stringify(m.originCounts))
            console.log('streaming cr=' + (s.cr||0) + ' nf=' + (s.nf||0) + ' jw=' + (s.jw||0) + ' over ' + m.runs + ' runs, share ' + m.streamingShare)
            console.log('median identity ' + m.medianIdentity + ', index ' + m.bytes.indexGz + ' gz, episodes ' + m.bytes.episodesGz + ' gz')
            if (total === 0) { console.error('REFUSING: no cr, nf or jw id reached the walk. The relay answered nothing from this runner.'); process.exit(1) }
          "

      # Four things about this block.
      #
      #   --latest=false is REQUIRED. The repo has no releases, so a plain create would make the seed
      #   the repo's "latest" and releases/latest/download/... would start resolving to it.
      #
      #   --clobber is NOT atomic: gh deletes the existing asset before uploading the new one, and a
      #   failed upload loses the original. Episodes go first and the index last, so the file the home
      #   path needs has the shortest missing window. Both degradations are safe: a missing asset falls
      #   back to the bundle, and a new episodes file beside an old index is refused by the runtime's
      #   generatedAt and commit equality check.
      #
      #   permissions: contents: write is declared above even though the repository default is already
      #   write, because a repository default can change under the workflow.
      #
      #   A release created with GITHUB_TOKEN does not trigger `on: release` workflows. Nothing here
      #   depends on that; do not build a downstream `on: release` job.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false \
                 --title 'Season seed' \
                 --notes 'Rolling asset, replaced by .github/workflows/season-seed.yml. Not a version.'
          gh release upload "$TAG" dist-seed/season-seed-episodes.json.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" dist-seed/season-seed.json.gz         --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" dist-seed/season-seed.manifest.json   --repo "$GITHUB_REPOSITORY" --clobber

      # A refused run has to stay readable, which is the whole reason the manifest is written even when
      # the gate says no.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: season-seed-manifest
          path: |
            dist-seed/season-seed.manifest.json
            dist-seed/export.log
          retention-days: 14
          if-no-files-found: warn
