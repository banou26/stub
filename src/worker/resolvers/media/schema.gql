
enum MediaType {
  TV
  """
  A televised run of very short episodes. Its own member rather than a TV with a small `episodeCount`,
  because AniList publishes the distinction and a viewer filtering for shorts is asking for exactly it.

  ONLY ANILIST EVER EMITS IT, and AniList loses `type` to jikan, which scores 0.9 against 0.8 and
  spells the same show TV. So a short jikan also carries profiles as TV in the aggregate and answers a
  TV filter rather than a TV_SHORT one. That is a known subset, not a bug to work around here: making
  it exact means changing which source wins `type`, and that precedence is what keeps a stale dump from
  overwriting a live catalogue (store/aggregate.ts:203, sources/offline/normalize.ts:19-31).

  INVISIBLE TO THE MERGE, and that takes real code rather than an omission. `mergeType` in
  store/fuzzy-merge.ts folds it back to TV before a cluster is profiled, because every gate in that
  file was calibrated on a corpus where AniList's shorts arrived spelled TV. Reading the new member
  there would move two profiles at once on a cluster AniList alone types, and an empty work-kind set
  disables the companion-content veto outright.
  """
  TV_SHORT
  MOVIE
  ANIME
  """Special episodes that have been included in DVD/Blu-ray releases, picture dramas, pilots, etc"""
  SPECIAL
  """(Original Video Animation) Anime that have been released directly on
DVD/Blu-ray without originally going through a theatrical release or
television broadcast"""
  OVA
  """(Original Net Animation) Anime that have been originally released online or are only available through streaming services."""
  ONA
  """Live action media such as movies or TV show"""
  LIVE_ACTION
}

enum MediaStatus {
  """Has completed and is no longer being released"""
  FINISHED
  """Currently releasing"""
  RELEASING
  """To be released at a later date"""
  NOT_YET_RELEASED
  """Ended before the work could be finished"""
  CANCELLED
  """Is currently paused from releasing and will resume at a later date"""
  HIATUS
}

"""
The broadcast season a run aired in.

Named by the SOURCE, never derived from `startDate` here. A bare year parses to January 1 and kitsu
answers YYYY-MM-01 for a month-only date (see `namesADay` in sources/season.ts), so deriving a season
from a start date would file every year-only row under WINTER.
"""
enum MediaSeason {
  WINTER
  SPRING
  SUMMER
  FALL
}

"""Broad content category. A media can belong to several (e.g. an anime film is ANIME + MOVIE)."""
enum MediaCategory {
  ANIME
  """An episodic series (TV / live-action / web)."""
  SERIES
  MOVIE
}

"""
What a handle asserts about the media carrying it. STRUCTURAL only: identity and containment.

Narrative relations between different works (prequel, sequel, adaptation, side story) are a SEPARATE
axis and will get their own `MediaRelation` enum on their own field. They are deliberately not mixed:
PREQUEL says nothing about whether two rows are the same media, and SAME_AS says nothing about story
order. One enum spanning both would mean neither.
"""
enum MediaHandleRelation {
  """
  The handle names THIS run. The only relation that unions clusters, in `upsertMedia`, and the union
  has NO INVERSE: once two media are welded they stay welded for the session.

  Minting this for an id that names a SHOW is the single most expensive mistake available here. It
  merged three Mushoku Tensei seasons, four Demon Slayer films and fifteen Dragon Ball Z films, each
  time because one id was the only thing a source could offer and the only relation was this one.
  """
  SAME_AS
  """
  This media is one PART of what the handle names: a run of that show, a film published under that
  series, a season of that title.

  It carries the handle's url WITHOUT claiming to be it, so a show-level id is worth keeping instead
  of being dropped. It never unions, so no number of these can weld two runs together. What it costs
  is that nothing may read episodes, titles, covers or any other metadata across it: the thing on the
  other end is a bigger thing, and its episode list is every run's at once.
  """
  PART_OF
  """
  This media HOLDS what the handle names: a season of this run, a part of this compilation, a range
  of episodes another packaging carries. The inverse direction of `PART_OF`, and it unions nothing.

  A run's page lists the catalogue seasons that hold it, a run split across seasons lists them all,
  and a container page lists its own seasons. It renders as a LINK and never as a button: the badge
  reader takes "SAME_AS first then anything" and playback takes SAME_AS only, so nothing here can
  place a play button on a row the store has not proven.
  """
  INCLUDES
}

"""
Which PAGE a row draws, as distinct from which identity space it lives in.

`MediaScope` answers "what does SAME_AS mean here"; this answers "what does this page look like". A
`FOLD` is a catalogue season whose every member is a part or an inclusion of some run: it draws its
OWN rows in its OWN numbering rather than following to the run, which is what a bookmark on such a
season has to open. `RUN` and `CONTAINER` mean what they mean on `MediaScope`.
"""
enum MediaKind {
  RUN
  CONTAINER
  FOLD
}

"""
Which kind of thing a row names, and so which identity space its SAME_AS claims union in.

Sameness is only ever asserted within one scope. A claim that crosses scopes is read as PART_OF,
whatever the producer asked for: a run is part of its show, never the same thing as it.
"""
enum MediaScope {
  """One broadcast run: a cour, a film. The unit this store aggregates and the unit a card shows."""
  RUN
  """A show, a series, a franchise page: something several runs are part of."""
  CONTAINER
}

"""
How one work relates to another as a STORY. The other axis, and never mixed with `MediaHandleRelation`.

That enum answers "are these the same thing", this one answers "how does this story connect to that
one", and the schema has kept them apart deliberately since the handle enum was written: PREQUEL says
nothing about sameness and SAME_AS says nothing about story order. Nothing here may ever union a
cluster. A sequel is a DIFFERENT work, and treating one as the same row is the mistake that merged
three Mushoku Tensei seasons when it was made with SAME_AS.

The values are AniList's set (`relationType(version: 2)`), which is the widest of the vocabularies in
play and the one MyAnimeList's own relation names map into without inventing anything. Confirmed
against live data 2026-09-08: anilist 108465 answers SOURCE, ALTERNATIVE and SEQUEL.
"""
enum MediaRelation {
  """This work adapts the other, which is usually the manga or novel it came from."""
  ADAPTATION
  """The other work comes first in the story."""
  PREQUEL
  """The other work comes after."""
  SEQUEL
  """The other work is the parent story this one hangs off."""
  PARENT
  """A story beside the main one rather than before or after it."""
  SIDE_STORY
  """The other work follows a character out of this one."""
  CHARACTER
  """A recap or digest of the other work."""
  SUMMARY
  """A different telling of the same story."""
  ALTERNATIVE
  """A work spun out of this one, sharing a world rather than a plot."""
  SPIN_OFF
  """The material this work was adapted FROM. The inverse of ADAPTATION."""
  SOURCE
  """Several works collected into one release."""
  COMPILATION
  """This work contains the other."""
  CONTAINS
  """Related, in a way the source did not name."""
  OTHER
}

"""
One narrative edge out of a media: what it relates to, and how.

The node is a SNAPSHOT and not necessarily a row this store has ever fetched. A franchise runs to
dozens of entries and resolving each before anything could render would make one modal cost dozens of
requests, so the edge carries what a card and a graph node need (uri, titles, format, status, cover,
episode count, start date) and nothing else is promised. Opening one navigates to its uri, and the
store fills that row in properly at that point.

Same shape as `MediaHandle` on purpose, so the same components render both.
"""
type MediaRelationEdge {
  """What this edge claims about the story. Never about identity."""
  relation: MediaRelation!
  """The related work, as much of it as the naming source supplied."""
  node: Media!
  """
  What KIND of work the other end is, in the naming source's own words: `TV`, `MOVIE`, `MANGA`,
  `NOVEL`, `ONE_SHOT`.

  A string, and on the EDGE rather than on the node, for one reason: `MediaType` is anime formats
  only, and a franchise's relations are mostly NOT anime. The novel a show adapts is the single most
  useful relation there is and it cannot be spelled in that enum. Widening `MediaType` to hold it
  would reach `mergeType` in store/fuzzy-merge.ts and every filter built on it, to carry something
  only ever displayed; the enum's own comment records what moving it costs.

  DISPLAY ONLY. Nothing may branch on it.
  """
  format: String
}

"""
One work in a franchise graph, thin enough that a whole series fits in one payload.
"""
type MediaFranchiseNode {
  """What a click navigates to. Also the id the edges below join on."""
  uri: String!
  titles: [MediaTitle!]!
  covers: [MediaCover!]!
  """The naming source's own word for the kind of work. Display only, as on `MediaRelationEdge`."""
  format: String
  status: MediaStatus
  episodeCount: Int
  startDate: Date
}

"""One arrow in a franchise graph, joining two `MediaFranchiseNode` uris."""
type MediaFranchiseEdge {
  from: String!
  to: String!
  relation: MediaRelation!
}

"""
Every work in one series, and how they connect: the whole graph rather than one media's own edges.

WHY IT IS NOT JUST `relations` WALKED. Following every edge leaks out of the franchise entirely. A
crossover promotional short relates BY CHARACTER to each series taking part, so two hops out of
`That Time I Got Reincarnated as a Slime` reaches Attack on Titan, Fire Force, Chihayafuru and seven
other unrelated shows. Measured 2026-09-08 against live AniList: following every edge reached 36
works of which 10 were off-franchise, while following only the STORY edges reached 21 works and none.

So CHARACTER and OTHER are reported as relations and never TRAVERSED. They answer "who appears in
this" and "these are connected somehow", neither of which is "this is the same series".
"""
type MediaFranchise {
  nodes: [MediaFranchiseNode!]!
  edges: [MediaFranchiseEdge!]!
}

"""One edge out of a media: which row, and what the edge claims about it."""
type MediaHandle {
  """The related row. Carries its own uri, origin, id and url."""
  node: Media!
  """What this edge asserts. Only SAME_AS unions clusters."""
  relation: MediaHandleRelation!
  """
  Where this handle came from, when it did not come from the source's own data.

  Unset, which is every handle a resolver builds out of its own payload, means the source's own
  statement and the store consumes it. `address` means the handle was rebuilt from the asked
  aggregated uri by `buildHandlesFromUri` (`src/sources/utils.ts`): the address names WHICH sources to
  ask and asserts nothing about how the rows relate, so such a claim routes a re-ask and enters no
  cluster. No other value is defined; an unknown one reads as unset.
  """
  provenance: String
  """
  WHY this handle is here, in the deriving rule's own word: `member`, `placeholder`, or the reason a
  containment link carried (`asserted`, `span`, `contested`, `prefix`). Null on a handle no plugin
  derived. Display and diagnosis only; nothing may branch on it.
  """
  via: String
  """Which plugin put it here, e.g. `plugin:aggregate`. Null outside the graph store."""
  by: String
}

"""
Where ONE field of an aggregated media got its value, and under which rule.

Read by the trace panel, so a wrong field is a question with an answer instead of a screenshot. A
per-field rule names one `uri`; a vote names every `uris` that backed it with the deciding `tier` and
its `witnesses`. `answerSeq` is the supplying member's `fieldSeq[field]`, which is the exact answer
behind the value.
"""
type MediaFieldProvenance {
  field: String!
  uri: String
  uris: [String!]
  answerSeq: Int
  tier: Float
  witnesses: Int
  rule: String!
}

"""
One rule the store evaluated over the whole graph that this media's cluster does not satisfy.

Reported, never repaired: an anomaly is a statement about the sources disagreeing, and hiding it
would make the disagreement look like a decision.
"""
type MediaAnomaly {
  rule: String!
  detail: String!
}

type Media {
  """Stable unique identifier that persists across URI changes and source additions"""
  _id: String!
  """Uri consists of the `origin` and `id` fields in the format `origin:id`"""
  uri: String!
  """String that is used to target a specific origin, e.g `google` or `yt` for youtube"""
  origin: String!
  """An id that references a specific resource within the origin space"""
  id: String!
  """An url to the media resource"""
  url: String
  """
  Every other row this media is related to, and what each relation actually claims.

  Was `[Media!]!`, a bare list, which forced one relation on everything: a handle either asserted
  sameness or did not exist. That is why a source holding only a show-level id had to choose between
  lying and staying silent, and why `worker/store/db.ts` had to special-case IMDb out of the graph
  entirely rather than carry its link.
  """
  handles: [MediaHandle!]!
  """
  Every work this one is related to as a STORY: prequels, sequels, the novel it adapts, side stories.

  Separate from `handles`, which is about identity. See `MediaRelation`. Empty rather than null when a
  source named none, which is most of them: only AniList supplies these today.
  """
  relations: [MediaRelationEdge!]!
  """
  The whole series this work belongs to, as a graph. Null where no source could supply one, which is
  most of them. NULLABLE deliberately: a non-null list that a source omits nulls the media carrying
  it, taking the rest of the payload with it.
  """
  franchise: MediaFranchise
  """Which identity space this row lives in. An absent value reads as RUN."""
  scope: MediaScope
  """
  Which page this row draws (`MediaKind`). Null from a store that does not compute it, which reads as
  `scope`.
  """
  kind: MediaKind
  """
  Which member supplied each field, and under which rule. Null from a store that records none.

  NULLABLE on purpose, like `franchise`: a non-null list absent from a payload nulls the media
  carrying it, and a listing card records no provenance.
  """
  provenance: [MediaFieldProvenance!]
  """Every anomaly the store filed against this row's cluster. Null where none were evaluated."""
  anomalies: [MediaAnomaly!]
  score: Float
  titles: [MediaTitle!]!
  type: MediaType
  """Broad categories this media belongs to (anime / series / movie); can be several."""
  categories: [MediaCategory!]!
  status: MediaStatus
  shortDescriptions(input: MediaShortDescriptionInput): [MediaShortDescription!]!
  descriptions(input: MediaDescriptionInput): [MediaDescription!]!
  trailers: [MediaTrailer!]!
  covers: [MediaCover!]!
  banners: [MediaBanner!]!
  averageScore: Int
  popularity: Int
  startDate: Date
  endDate: Date
  isAdult: Boolean
  episodeCount: Int
  """
  The next episode AniList has scheduled, or null.

  Asked in the same query as the rest of AniList's record, so it costs no request. It can have aired
  since AniList answered. Null means "nobody scheduled anything ahead", which covers a finished run
  and a source that publishes no schedule alike: it is not a promise that the run has ended.
  """
  nextAiringEpisode: MediaAiringEpisode
  """The broadcast season this run aired in, as the source named it."""
  season: MediaSeason
  """
  The calendar year `season` belongs to.

  Separate from `startDate` because it survives a coerced date: a source that only knows the year
  still files the run under the right season when another source names one, and a January premiere
  stays in the WINTER of its own year rather than the FALL of the year before.
  """
  seasonYear: Int
  """
  Broad content descriptors, deduplicated across the cluster, richest source first.

  Free-form strings rather than an enum because no two catalogues agree on a fixed set, and an enum
  would have to drop every value it had not anticipated. Supplied by AniList and jikan; the bundled
  offline catalogue publishes none, so a genre filter cannot be answered during an upstream outage.
  """
  genres: [String!]!
  """
  Finer-grained descriptors than `genres`, from AniList's own tag vocabulary.

  Kept apart from genres rather than merged into one list because AniList publishes them separately
  and its own browse UI groups them separately, so a merged list could not reproduce either. Tags
  AniList marks as a spoiler are dropped at the source and never reach here.
  """
  tags: [String!]!
  episodes: [Episode!]!
  """
  The characters, main roles first, each with its voice actors per language. Null unless the request
  asked `details`, NULLABLE like `franchise`: a listing card asks none.
  """
  characters: [MediaCharacter!]
  """The staff, each person once with every job the sources name. Null unless `details` was asked."""
  staff: [MediaPerson!]
  """The animation studios, main first."""
  studios: [String!]
  """Minutes per episode."""
  duration: Int
  """What the work adapts, in the source's word: MANGA, LIGHT_NOVEL, ORIGINAL."""
  sourceMaterial: String
  """
  The opening, ending and insert songs, openings first, taken whole from one source. Null unless
  `details` was asked.
  """
  themes: [MediaTheme!]
  """Each rating site's score, one per site, from the first source in score order that has it."""
  ratings: [MediaRating!]
  """
  Every season of the show this run is part of, or of the show itself, in order, each its own run.
  Null where no source lists them, and for anime.
  """
  seasons: [MediaSeasonLink!]
  """
  Whether every source asked about this media has settled: answered for the last time, failed, or been
  out for 30 seconds. Set by the `media` subscription alone, and false again while a source the media
  has just been found under is asked.
  """
  settled: Boolean
}

"""One season of a show: its number and the uri of its own run."""
type MediaSeasonLink {
  number: Int!
  uri: String!
}

"""One rating site's score for a title, out of `scale`: IMDb 8.4 of 10, Rotten Tomatoes 92 of 100."""
type MediaRating {
  source: String!
  value: Float!
  scale: Int!
}

"""An opening, ending or insert song, with a video it can be played from."""
type MediaTheme {
  """OP, ED or IN."""
  kind: String!
  """Its number among its kind, null where the source gives none."""
  sequence: Int
  title: String
  artists: [String!]!
  """Null where the source lists the song before any video of it."""
  video: String
}

"""
A person in a title's credits: a staff member with `roles`, or a voice actor with `language`. One entry
can stand for the same person in several sources, joined only by a shared id.
"""
type MediaPerson {
  name: String!
  image: String
  url: String
  """
  A primary language subtag (`ja`, `en`), or the source's own word when it is not a known language.
  Null for an actor in live action, who plays the part on screen.
  """
  language: String
  roles: [String!]
}

"""A character in a title, joined across sources by a shared id, with its voice actors per language."""
type MediaCharacter {
  name: String!
  image: String
  url: String
  """MAIN, SUPPORTING or BACKGROUND. A string rather than an enum, for the reason `genres` gives."""
  role: String
  voiceActors: [MediaPerson!]!
}

type MediaTitle {
  language: String!
  title: String!
  score: Float
}

input MediaShortDescriptionInput {
  type: MediaDescriptionContentType = TEXT
  count: Int
}

type MediaShortDescription {
  language: String!
  shortDescription: String!
  score: Float
}

enum MediaDescriptionContentType {
  HTML
  TEXT
}

input MediaDescriptionInput {
  type: MediaDescriptionContentType = TEXT
  count: Int
}

type MediaDescription {
  language: String!
  description: String!
  score: Float
}

type MediaTrailer {
  """Uri consists of the `origin` and `id` fields in the format `origin:id`"""
  uri: String!
  """String that is used to target a specific origin, e.g `google` or `yt` for youtube"""
  origin: String!
  """An id that references a specific resource within the origin space"""
  id: String!
  """An url to the media resource"""
  url: String
  language: String
  thumbnail: String
}

type MediaAiringEpisode {
  """Which episode of the run this is, as the source numbers it."""
  episodeNumber: Int!
  """When it airs."""
  airingAt: Date!
}

type MediaCover {
  language: String
  url: String!
  height: Int
  width: Int
  """Average #hex color of cover image"""
  color: String
  score: Float
}

type MediaBanner {
  language: String
  url: String!
  height: Int
  width: Int
  """Average #hex color of cover image"""
  color: String
  score: Float
}

"""
What the app asked for at the TOP of the call, so a source can tell a detail view from a listing.

THE WORKER WRITES THIS. Every field is regenerated from the worker's own registry at each source's
boundary before the arguments are coerced, so a value supplied by a caller is replaced rather than
trusted, and only `token` is ever read off the wire. Nullable because the app's own documents send
none: they are validated by the app-level server before the fan-out that stamps them runs.
"""
input RequestContext {
  """Identifies THIS hop to the worker. The only field read back off the wire."""
  token: ID!
  """Stable for the whole call tree, so a source may memoize per root rather than per hop."""
  rootId: ID!
  operation: RootOperation!
  """The origins already on the stack, nearest last. A source seeing itself here is in a cycle."""
  chain: [String!]!
}

enum RootOperation {
  MEDIA
  MEDIA_PAGE
  SIMILAR_MEDIA
}

input MediaInput {
  uri: ID
  context: RequestContext
  """Asks the sources for credits, themes and ratings too: a larger request, so only a title's own page sends it."""
  details: Boolean
}

"""
How a page is ordered. A bare member sorts ASCENDING and its `_DESC` twin descending, the reading the
suffix carries in every enum of this shape, AniList's `MediaSort` included, which these two members
are borrowed from. A media the sources give no value for sorts LAST in both directions.

Naming more than one member runs them in order and the last one decides.
"""
enum MediaSort {
  """Least popular first."""
  POPULARITY
  """Most popular first. What the home row and the search page ask for."""
  POPULARITY_DESC
}

input MediaPageInput {
  context: RequestContext
  """Filter by media IDs"""
  nodes: [MediaInput!]
  """Filter by search terms"""
  search: String
  """Filter by the media's current release status"""
  status: MediaStatus
  """Filter by category (anime / series / movie); media matching ANY of these are kept."""
  categories: [MediaCategory!]
  """Filter by format; media whose `type` is ANY of these are kept. A media with no type is dropped."""
  formats: [MediaType!]
  """
  Filter by broadcast season. Pair it with `seasonYear` to name one season rather than every WINTER.

  A source that can answer a season directly is asked for THIS one instead of the clock's; a source
  that cannot answers nothing rather than answering the current season, which would look like a
  result set and be the wrong year.
  """
  season: MediaSeason
  """Filter by the year of `season`."""
  seasonYear: Int
  """Filter by genre; media carrying ALL of these are kept, compared case-insensitively."""
  genres: [String!]
  """Filter by tag; media carrying ALL of these are kept, compared case-insensitively."""
  tags: [String!]

  sorts: [MediaSort!]

  """Filter by the start date of the media"""
  startDate: Date
  """Filter by the end date of the media"""
  endDate: Date

  """Cursor from where to start"""
  at: Id
  """How many pages before the cursor to return"""
  before: Int
  """How many pages after the cursor to return"""
  after: Int
}

type MediaPage {
  """The current page"""
  firstPageCursor: Id
  """The current page"""
  previousPageCursor: Id
  """The current page"""
  currentPageCursor: Id
  """The first page"""
  nextPageCursor: Id
  """The last page cursor"""
  lastPageCursor: Id
  """Total number of items on the current page"""
  currentPageNodeCount: Int
  """The total number of items. Note: This value is not guaranteed to be accurate, do not rely on this for logic"""
  totalNodeCount: Int
  """Total number of items before the current page. Note: This value is not guaranteed to be accurate, do not rely on this for logic"""
  beforeCurrentPageNodeCount: Int
  """Total number of items after the current page. Note: This value is not guaranteed to be accurate, do not rely on this for logic"""
  afterCurrentPageNodeCount: Int
  """The media page nodes"""
  nodes: [Media!]!
}

"""
The run a caller is looking for, described by EVIDENCE about its own run and never by a season number.

Stub models a broadcast run; every catalogue models a show with seasons hanging off it, and no two
catalogues number those seasons the same way. Netflix folds two cours into one season (its season 2 of
Mushoku Tensei is 25 episodes over anime's 13 and 12), JustWatch numbers by its own list, anime metadata
says "Season 2 Part 2". Two numberings in one id space collide: on 2026-09-05 anime season 1 (11
episodes, no ordinal in its title) took `nf:80987039-3` by episode count while season 3 took the same id
by its ordinal, and `graph.link` has no inverse. So a caller holding a show-level id says what it knows
about ITS run and the owning origin answers with the one run of that show the evidence establishes, or
with null.

What counts as established is decided in ONE place, `sources/similar.ts`, and every answering source
goes through it: a season premiere within 45 days of a day-precise start, episode titles covering most
of a season, an ordinal every title agrees on with an episode count the season does not exceed, the
one season dated our year holding no more than our count, or the first season holding our episodes. A
season holding MORE episodes than the run is a fold of several runs and is never the answer, and a
season whose length is unknown cannot be shown not to be one. Anything ambiguous is null.

The rules decide WHICH season of the show and never WHICH show: `showId` settles that, and it came off
a PART_OF edge whose container cluster a listing's fuzzy title pass may have unioned, so an answer is
only as right as that union.
"""
input SimilarMediaInput {
  """The show's id in the ANSWERING origin's own space: a Crunchyroll series id, a Netflix title id, a JustWatch node objectId."""
  showId: ID!
  """When our run started. A date naming a DAY is matched within 45 days; a bare year (`YYYY-01-01`) vetoes a season dated another year and, with an episode count on both sides, names the one season dated ours."""
  startDate: Date
  """Every title the caller knows for its run. Read for the season ordinals they agree on, never for the franchise: the show id already settles that."""
  titles: [String!]
  """How many episodes our run has. A season holding more is a fold of several runs and is refused."""
  episodeCount: Int
  """The titles of our run's episodes, when the caller has them. A season most of whose episode titles we carry is ours; one sharing none is not, whatever its number."""
  episodeTitles: [String!]
  context: RequestContext
}

extend type Subscription {
  media(input: MediaInput!): Media
  mediaPage(input: MediaPageInput!): MediaPage!
  """
  The one run of `showId` that is the caller's run by the evidence given, or null.

  The answer is a RUN at the answering origin and carries no handle naming another run: the CALLER
