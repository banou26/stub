"""
Where a list entry stands. The same six words for every tracker; a tracker maps its own onto these.
"""
enum ListStatus {
  WATCHING
  REWATCHING
  PLANNING
  COMPLETED
  PAUSED
  DROPPED
}

"""What one tracker could say about one media."""
enum TrackerState {
  """The tracker holds an entry for this media."""
  LISTED
  """The media is addressable on this tracker and nothing is listed for it."""
  NOT_LISTED
  """The media names no id this tracker can address, so it cannot be listed there."""
  NO_ID
  """
  The media names two ids of the tracker's origin and neither extends the other, so the tracker cannot
  tell which entry is meant. It lists both in `candidates` and refuses writes.
  """
  AMBIGUOUS
  SIGNED_OUT
  """The tracker asked to be left alone for a while, and answers again after it."""
  PAUSED
  ERROR
}

enum TrackingField {
  STATUS
  PROGRESS
  SCORE
  STARTED_AT
  COMPLETED_AT
  REWATCH_COUNT
}

enum WriteState {
  SAVED
  """Accepted and sent later."""
  QUEUED
  """Never attempted: the tracker cannot take this write (no id, ambiguous, read only, signed out)."""
  REFUSED
  """Attempted and failed."""
  FAILED
}

"""A date that may name only a year, or a year and a month."""
type FuzzyDate {
  year: Int
  month: Int
  day: Int
}

input FuzzyDateInput {
  year: Int
  month: Int
  day: Int
}

"""A tracking provider and where the viewer stands with it."""
type Tracker {
  id: String!
  name: String!
  icon: String
  color: String
  signedIn: Boolean!
  """Whose list this is, as the tracker names it, or where it is kept."""
  account: String
  canWrite: Boolean!
  """The scale the viewer scores in on this tracker. Scores on the wire are always 0 to 100."""
  scoreScale: String!
  """What a write to this tracker does beyond the list itself, said where the viewer picks it."""
  writeNotice: String
  """
  Whether a write keeps the page's `episodeCount` as this tracker's count for the entry, as stub's own
  tracker does. False for a tracker that counts the episodes itself and says how many on its answers.
  """
  keepsPageEpisodeCount: Boolean!
  """
  The fields this tracker reads and writes through stub. A sync never plans a field onto a tracker that
  does not keep it, and never counts it as a difference there.
  """
  keeps: [TrackingField!]!
  """
  Whether this tracker starts a rewatch only on an entry it lists as COMPLETED, and ends one only as
  COMPLETED, which counts one finished rewatch there, as MyAnimeList does. A sync onto it refuses any
  other move into or out of REWATCHING.
  """
  rewatchThroughCompleted: Boolean!
}

"""
One tracker's own entry for one media, or the display-only summary of several.

`_id` is the tracker's own entry id, prefixed by the tracker. The summary's `_id` is never one a tracker
uses, so a normalising cache can never fold the summary into one tracker's entry.
"""
type ListEntry {
  _id: ID!
  """The tracker that holds this entry, or `summary`."""
  tracker: String!
  """The id the tracker keys this entry on, in its own space: `anilist:166873`, or the uri summarised."""
  mediaUri: String
  status: ListStatus
  progress: Int
  """0 to 100, whatever scale the tracker keeps."""
  score: Int
  """The score in the viewer's own scale on that tracker."""
  scoreLabel: String
  startedAt: FuzzyDate
  completedAt: FuzzyDate
  rewatchCount: Int
  updatedAt: Date
  url: String
  title: String
  cover: String
  """How many episodes THIS tracker counts for its entry, which need not be the media page's count."""
  episodeCount: Int
}

type TrackerAnswer {
  _id: ID!
  tracker: Tracker!
  state: TrackerState!
  entry: ListEntry
  """The tracker's ids the media names, when `state` is AMBIGUOUS."""
  candidates: [String!]!
  error: String
  """Writes accepted and not yet sent."""
  pending: Int!
  """
  How many episodes this tracker counts for the media, whether it lists it or not, so a sync onto a
  tracker that lists nothing yet can tell whether progress means the same there. Null when it does not say.
  """
  episodeCount: Int
}

"""
Every tracker's answer about one media, each standing alone, plus a summary for display.

The summary is written nowhere and read by nothing but the screen: a write goes to the trackers the
viewer names, never to the summary.
"""
type Tracking {
  _id: ID!
  answers: [TrackerAnswer!]!
  summary: ListEntry
  """The fields on which the listed answers with the same episode count differ."""
  disagreements: [TrackingField!]!
}

type WriteOutcome {
  tracker: String!
  outcome: WriteState!
  entry: ListEntry
  error: String
}

input TrackingInput {
  """The media, as the page addresses it. Usually the aggregated uri the store has grown it to."""
  uri: ID!
  """Only these trackers. Every tracker when absent."""
  trackers: [String!]
}

"""Every field is optional. An absent field is left as it is; an explicit null clears it."""
input ListEntryInput {
  status: ListStatus
  progress: Int
  score: Int
  startedAt: FuzzyDateInput
  completedAt: FuzzyDateInput
  rewatchCount: Int
}

input SaveListEntryInput {
  uri: ID!
  """
  The trackers this write goes to, and the only ones. No tracker is written to because it is
  connected: the viewer names each one.
  """
  trackers: [String!]!
  entry: ListEntryInput!
  """What the page showed for the media, kept beside the entry so a list can draw it without the page."""
  title: String
  cover: String
  episodeCount: Int
}

input DeleteListEntryInput {
  uri: ID!
  trackers: [String!]!
}

"""Whose list stub's own tracker shows and writes on this device."""
enum StubListLocation {
  """Kept on this device only. It never reaches an FKN account unless the viewer adds it."""
  DEVICE
  """The signed in FKN account's list, which every device signed in to that account shares."""
  ACCOUNT
}

"""Where stub's own list stands on this device, and what waits on the viewer."""
type StubTrackerStorage {
  location: StubListLocation!
  """Whether an FKN account is signed in. Null while that could not be told."""
  signedIn: Boolean
  """Signed in, and this device does not hold the key the account's list is sealed with."""
  locked: Boolean!
  """Changes on this device the account has not received yet."""
  waiting: Boolean!
  """
  Entries of the list this device kept before an account's list was opened here, set aside until the
  viewer adds them to the account. They come back as this device's list on a sign out.
  """
  held: Int!
  error: String
}

extend type Subscription {
  tracking(input: TrackingInput!): Tracking
  stubTrackerStorage: StubTrackerStorage!
}

extend type Mutation {
  saveListEntry(input: SaveListEntryInput!): [WriteOutcome!]!
  deleteListEntry(input: DeleteListEntryInput!): [WriteOutcome!]!
  """
  Adds the entries this device set aside to the FKN account's list. The only way a list kept on a
  device reaches an account, so only ever sent from the viewer's click.
  """
  addHeldStubEntries: StubTrackerStorage!
}
