
type Episode {
  """Stable unique identifier that persists across URI changes and source additions"""
  _id: String!
  """Uri consists of the `origin` and `id` fields in the format `origin:id`"""
  uri: String!
  """String that is used to target a specific origin, e.g `google` or `yt` for youtube"""
  origin: String!
  """An id that references a specific resource within the origin space"""
  id: String!
  """An url to the media resource"""
  url: String
  """Uri to the media resource"""
  mediaUri: String!
  """Every other row this episode is related to. See `MediaHandle` for why the relation is explicit."""
  handles: [EpisodeHandle!]!
  score: Float
  titles: [EpisodeTitle!]!
  shortDescriptions(input: EpisodeShortDescriptionInput): [EpisodeShortDescription!]!
  descriptions(input: EpisodeDescriptionInput): [EpisodeDescription!]!
  releaseDate: Date
  relativeNumber: Int
  absoluteNumber: Int
  thumbnails: [EpisodeThumbnail!]!
  # playbackSources: [PlaybackSource!]!
  """URL for an embeddable player iframe"""
  embedUrl: String
  seasonNumber: Int
  episodeNumber: Int
  absoluteEpisodeNumber: Int
  """Runtime in minutes"""
  runtime: Int
  """
  What this source's stream offers, as display labels: `4K`, `HD`, `Dolby Vision`, `HDR`. Only what
  the source states before playback; absent when it states nothing. Never merged across sources.
  """
  videoQualities: [String!]
  """The same for its sound: `5.1`, `Dolby Atmos`, or a codec a release names"""
  audioQualities: [String!]
  """The audio languages this source's stream carries, as BCP 47 tags"""
  audioLanguages: [String!]
  """The subtitle languages this source's stream carries, as BCP 47 tags"""
  subtitleLanguages: [String!]
}

type EpisodeTitle {
  language: String!
  title: String!
  score: Float
}

input EpisodeShortDescriptionInput {
  type: EpisodeDescriptionContentType = TEXT
  count: Int
}

type EpisodeShortDescription {
  language: String!
  shortDescription: String!
  score: Float
}

enum EpisodeDescriptionContentType {
  """The source's own HTML with only its text, formatting, links and remote images left, to draw as HTML"""
  HTML
  """Plain text, the source's Markdown read"""
  TEXT
}

input EpisodeDescriptionInput {
  type: EpisodeDescriptionContentType = TEXT
  count: Int
}

type EpisodeDescription {
  language: String!
  description: String!
  score: Float
}


type EpisodeThumbnail {
  language: String
  url: String!
  height: Int
  width: Int
  """Average #hex color of cover image"""
  color: String
  score: Float
}

"""
One edge out of an episode. Shares `MediaHandleRelation` with media on purpose: the two questions are
the same question, and a second enum with the same two values would drift.
"""
type EpisodeHandle {
  """The related row. Carries its own uri, origin, id and url."""
  node: Episode!
  """What this edge asserts. Only SAME_AS unions clusters."""
  relation: MediaHandleRelation!
}
